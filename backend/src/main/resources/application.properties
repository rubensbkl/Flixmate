server.port=6789
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flixmate}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
mail.from=${MAIL_FROM:noreply@flixmate.com}
frontend.url=${FRONTEND_URL:http://localhost:3000}

# OAuth2 Configuration
oauth.google.clientId=${GOOGLE_CLIENT_ID:}
oauth.google.clientSecret=${GOOGLE_CLIENT_SECRET:}
oauth.google.redirectUri=http://localhost:3000/oauth/callback

oauth.github.clientId=${GITHUB_CLIENT_ID:}
oauth.github.clientSecret=${GITHUB_CLIENT_SECRET:}
oauth.github.redirectUri=http://localhost:3000/oauth/callback
