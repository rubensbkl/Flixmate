# Ambiente de desenvolvimento. As variáveis vêm do .env (veja .env.example).
services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - dev-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: maven:3.8.8-eclipse-temurin-17
    working_dir: /app
    command: mvn compile exec:java -Dexec.mainClass=app.Application
    ports:
      - "6789:6789"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    networks:
      - dev-network
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:6789}
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - dev-network

  ai:
    build:
      context: ./ai
    ports:
      - "5005:5005"
    volumes:
      - ./ai:/app
      - ai-model-data:/app/model_data
    env_file:
      - .env
    networks:
      - dev-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  dev-network:

volumes:
  postgres-data:
  ai-model-data:
