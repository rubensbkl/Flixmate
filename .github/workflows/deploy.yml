# O ambiente de produção (flixmate.com.br) foi desligado depois da entrega do trabalho.
# O workflow fica aqui como registro do deploy que existia e só roda sob acionamento manual.
name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_IP }} << 'EOF'
            cd /root/Flixmate
            git pull origin main
            docker-compose -f docker-compose.yml down 
            docker-compose -f docker-compose.yml up -d --build
          EOF
