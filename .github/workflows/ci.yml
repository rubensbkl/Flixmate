name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e empacotar
        working-directory: backend
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci
      - name: Build de produção
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:6789
        run: npm run build

  ai:
    name: Serviço de IA (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai/requirements.txt
      - name: Instalar dependências
        working-directory: ai
        run: pip install -r requirements.txt
      - name: Verificar sintaxe e importação do serviço
        working-directory: ai
        run: |
          python -m compileall -q .
          python -c "import inference"

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar os arquivos de compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.dev.yml config > /dev/null
          docker compose -f docker-compose.yml config > /dev/null
